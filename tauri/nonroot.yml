services:
  app:
    image: tauri-non-root-dev:latest
    container_name: project
    privileged: true
    stdin_open: true
    tty: true
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DISPLAY: ${DISPLAY}
    volumes:
      - /run/user/1000/at-spi/bus:/run/user/1000/at-spi/bus
      - /path/to/workdir:/home/ubuntu/workdir
