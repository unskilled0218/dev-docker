services:
  app:
    image: git.lan/dev/my-base:latest
    container_name: project
    stdin_open: true
    tty: true
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /home/container/workdir/project
    volumes:
      - ./:/home/container/workdir
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.local/share/opencode/opencode.db:/home/container/.local/share/opencode/opencode.db
      - ${HOME}/.opencode/bin:/home/container/.opencode/bin
      - type: bind
        source: ${HOME}/.ssh
        target: /home/container/.ssh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.gitconfig
        target: /home/container/.gitconfig
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.config
        target: /home/container/.config
        read_only: true
        bind:
          create_host_path: false