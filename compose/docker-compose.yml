services:
  app:
    image: git.lan/dev/npm:latest
    container_name: project
    stdin_open: true
    tty: true
    ports:
      - 5000:5000
    environment:
      PW_TEST_CONNECT_WS_ENDPOINT: ws://playwright:3000/
    networks:
      - development
    working_dir: /home/container/workdir
    volumes:
      - ./:/home/container/workdir
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  development:
    external: true
    name: development
