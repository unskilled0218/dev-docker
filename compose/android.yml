name: android-vm

services:
  android:
    platform: linux/amd64
    build:
      context: ../Dockerfile
      dockerfile: android.Dockerfile
    init: true
    user: "1000:1000"
    network_mode: host
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:?Set KVM_GID to the numeric group of /dev/kvm}"
    volumes:
      - android-data:/home/android/.android
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f ~/.android/avd/android-vm.ini ]; then
          echo no | avdmanager create avd -n android-vm -k 'system-images;android-36;google_apis;x86_64'
        fi
        adb start-server
        exec emulator @android-vm -accel on -port 5554 -no-window -no-audio -gpu software
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(adb -s emulator-5554 shell getprop sys.boot_completed)\" = 1 ]"]
      interval: 10s
      timeout: 5s
      start_period: 3m
      retries: 12

volumes:
  android-data:
