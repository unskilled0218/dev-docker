name: development-playwright

services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    user: pwuser
    working_dir: /home/pwuser
    init: true
    shm_size: "1gb"
    environment:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    command: ["npx", "-y", "playwright@1.64.1", "run-server", "--host", "0.0.0.0", "--port", "3000"]
    healthcheck:
      test: ["CMD", "node", "/opt/playwright-healthcheck.cjs"]
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 12
    volumes:
      - type: bind
        source: ../scripts/playwright-healthcheck.cjs
        target: /opt/playwright-healthcheck.cjs
        read_only: true
        bind:
          create_host_path: false
    networks:
      - development

networks:
  development:
    name: development
    driver: bridge
