services:
  app:
    image: tauri-dev:latest
    container_name: project
    privileged: true
    stdin_open: true
    tty: true
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DISPLAY: ${DISPLAY}
    working_dir: /home/dev/workdir
    volumes:
      - ./:/home/dev/workdir
      - /run/user/1000/at-spi/bus:/run/user/1000/at-spi/bus
      - /dev/bus/usb:/dev/bus/usb
      - /home/${USER}/.Xauthority:/home/dev/.Xauthority