services:
  app:
    image: image
    container_name: project
    stdin_open: true
    tty: true
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /home/ubuntu/workdir
    volumes:
      - ./:/home/ubuntu/workdir
      - type: bind
        source: ${HOME}/.ssh
        target: /home/dev/.ssh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.gitconfig
        target: /home/dev/.gitconfig
        read_only: true
        bind:
          create_host_path: false